<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisionType prototype</title>
    <script>
      // Apply the saved theme before the page paints, so there is no flash of the wrong theme.
      (function () {
        var choice = 'dark';
        try { choice = localStorage.getItem('vt-theme') || 'dark'; } catch (e) {}
        if (choice === 'system') {
          choice = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', choice === 'light' ? 'light' : 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
